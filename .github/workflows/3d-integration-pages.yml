name: Publish Satish OS professional hero review
on:
  push:
    branches: [feature/polish-3d-character-20260928]
    paths:
      - index.html
      - styles.css
      - app.js
      - resume/**
      - .github/workflows/3d-integration-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: satish-os-professional-hero-review
  cancel-in-progress: true

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout professional polish branch
        uses: actions/checkout@v4
        with:
          ref: feature/polish-3d-character-20260928
          path: professional

      - name: Checkout stable review
        uses: actions/checkout@v4
        with:
          ref: review/final-cinematic-20260928
          path: stable

      - name: Build improved resume
        run: |
          python3 -m pip install --quiet reportlab
          python3 professional/resume/build_resume.py professional/assets/resume/Satish_Kumar_Tiwari_Resume.pdf
          test "$(stat -c%s professional/assets/resume/Satish_Kumar_Tiwari_Resume.pdf)" -gt 1000

      - name: Assemble stable root plus professional polish previews
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/polish _site/polish3d

          cp stable/index.html stable/styles.css stable/app.js _site/
          cp stable/index.html _site/review-current.html
          cp -R stable/assets _site/

          for target in polish polish3d; do
            cp professional/index.html professional/styles.css professional/app.js "_site/$target/"
            cp -R professional/assets "_site/$target/"
            touch "_site/$target/.nojekyll"
          done
          touch _site/.nojekyll

      - name: Install Google Chrome QA runtime
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chrome >/dev/null

      - name: Verify professional cinematic hero locally
        run: |
          set -euo pipefail
          node --check professional/app.js
          python3 -m http.server 4182 --directory _site >/tmp/satish-professional-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const path of ['/polish/','/polish3d/']){
              const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'no-preference'});
              const errors=[]; page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4182'+path+'?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#intro').waitFor({state:'visible',timeout:6000});
              await page.locator('#skipIntro').click();
              await page.locator('.hero-visual').waitFor({state:'visible',timeout:3000});

              if(await page.locator('#heroCharacter3D').count()) throw new Error(path+' still contains 3D canvas');
              if(await page.locator('script[src*="character-3d"]').count()) throw new Error(path+' still loads 3D runtime');

              const video=page.locator('#heroIdle');
              const before=await video.evaluate(v=>v.currentTime);
              await page.waitForTimeout(1200);
              const after=await video.evaluate(v=>({time:v.currentTime,paused:v.paused,src:v.currentSrc}));
              if(after.paused||after.time<=before+.08)throw new Error(path+' cinematic hero is not playing: '+JSON.stringify({before,...after}));
              if(!after.src.includes('satish-idle.mp4'))throw new Error(path+' unexpected hero source: '+after.src);

              if(errors.length)throw new Error(path+' '+errors.join(' | '));
              await page.close();
            }
            await browser.close();
            console.log('PROFESSIONAL HERO QA PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy professional review
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live professional hero
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'no-preference'});
            const url='https://ktiwari539.github.io/satish-os-portfolio/polish3d/?professional=1&qa='+Date.now();
            let ok=false;
            for(let i=0;i<8;i++){
              try{
                const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
                if(r?.ok()){ok=true;break}
              }catch(e){}
              await page.waitForTimeout(2500);
            }
            if(!ok)throw new Error('live professional review unavailable');
            await page.locator('#intro').waitFor({state:'visible',timeout:8000});
            await page.locator('#skipIntro').click();

            if(await page.locator('#heroCharacter3D').count())throw new Error('live page still contains 3D canvas');
            if(await page.locator('script[src*="character-3d"]').count())throw new Error('live page still loads 3D runtime');

            const before=await page.locator('#heroIdle').evaluate(v=>v.currentTime);
            await page.waitForTimeout(1200);
            const state=await page.locator('#heroIdle').evaluate(v=>({time:v.currentTime,paused:v.paused,src:v.currentSrc}));
            if(state.paused||state.time<=before+.08)throw new Error('live cinematic hero is not playing: '+JSON.stringify({before,...state}));
            console.log('LIVE PROFESSIONAL HERO QA PASS',state);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
