name: Publish Satish OS professional review
on:
  push:
    branches: [feature/portfolio-professional-final-20260928]
    paths:
      - index.html
      - styles.css
      - app.js
      - resume/**
      - assets/video/**
      - .github/workflows/professional-review-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: satish-os-professional-review
  cancel-in-progress: true

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout professional polish branch
        uses: actions/checkout@v4
        with:
          ref: feature/portfolio-professional-final-20260928
          path: professional

      - name: Checkout stable review
        uses: actions/checkout@v4
        with:
          ref: review/final-cinematic-20260928
          path: stable

      - name: Build improved resume
        run: |
          python3 -m pip install --quiet reportlab
          python3 professional/resume/build_resume.py professional/assets/resume/Satish_Kumar_Tiwari_Resume.pdf
          test "$(stat -c%s professional/assets/resume/Satish_Kumar_Tiwari_Resume.pdf)" -gt 1000

      - name: Assemble stable root plus professional polish previews
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/polish

          cp stable/index.html stable/styles.css stable/app.js _site/
          cp stable/index.html _site/review-current.html
          cp -R stable/assets _site/

          cp professional/index.html professional/styles.css professional/app.js _site/polish/
          cp -R professional/assets _site/polish/
          touch _site/polish/.nojekyll
          touch _site/.nojekyll

      - name: Install Google Chrome QA runtime
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chrome >/dev/null

      - name: Verify professional cinematic hero locally
        run: |
          set -euo pipefail
          node --check professional/app.js
          python3 -m http.server 4182 --directory _site >/tmp/satish-professional-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [scene,expected] of [['dark','satish-idle.mp4'],['light','satish-workday-white.mp4']]){
              const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'no-preference'});
              const errors=[]; page.on('pageerror',e=>errors.push(e.message));
              const path='/polish/?hero='+scene+'&qa='+Date.now();
              await page.goto('http://127.0.0.1:4182'+path,{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#intro').waitFor({state:'visible',timeout:6000});
              await page.locator('#skipIntro').click();
              await page.locator('.hero-visual').waitFor({state:'visible',timeout:3000});

              if(await page.locator('#heroCharacter3D').count()) throw new Error(path+' still contains 3D canvas');
              if(await page.locator('script[src*="character-3d"]').count()) throw new Error(path+' still loads 3D runtime');

              const video=page.locator('#heroIdle');
              const before=await video.evaluate(v=>v.currentTime);
              await page.waitForTimeout(1200);
              const after=await video.evaluate(v=>({time:v.currentTime,paused:v.paused,src:v.currentSrc,loop:v.loop,w:v.videoWidth,h:v.videoHeight}));
              if(after.paused||after.time<=before+.08)throw new Error(path+' hero is not playing: '+JSON.stringify({before,...after}));
              if(!after.src.includes(expected))throw new Error(path+' unexpected hero source: '+after.src);
              if(after.loop)throw new Error(path+' hero must not hard-loop');
              if(scene==='light'&&(after.w!==854||after.h!==480))throw new Error(path+' cleaned workday asset dimensions unexpected: '+after.w+'x'+after.h);

              if(errors.length)throw new Error(path+' '+errors.join(' | '));
              await page.close();
            }
            await browser.close();
            console.log('PROFESSIONAL HERO QA PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy professional review
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live professional hero
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [scene,expected] of [['dark','satish-idle.mp4'],['light','satish-workday-white.mp4']]){
              const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'no-preference'});
              const url='https://ktiwari539.github.io/satish-os-portfolio/polish/?hero='+scene+'&professional=1&qa='+Date.now();
              let ok=false;
              for(let i=0;i<8;i++){
                try{
                  const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
                  if(r?.ok()){ok=true;break}
                }catch(e){}
                await page.waitForTimeout(2500);
              }
              if(!ok)throw new Error('live professional review unavailable for '+scene);
              await page.locator('#intro').waitFor({state:'visible',timeout:8000});
              await page.locator('#skipIntro').click();

              if(await page.locator('#heroCharacter3D').count())throw new Error('live page still contains 3D canvas');
              if(await page.locator('script[src*="character-3d"]').count())throw new Error('live page still loads 3D runtime');

              const video=page.locator('#heroIdle');
              const before=await video.evaluate(v=>v.currentTime);
              await page.waitForTimeout(1200);
              const state=await video.evaluate(v=>({time:v.currentTime,paused:v.paused,src:v.currentSrc,loop:v.loop,w:v.videoWidth,h:v.videoHeight}));
              if(state.paused||state.time<=before+.08)throw new Error('live hero is not playing: '+JSON.stringify({before,...state}));
              if(!state.src.includes(expected))throw new Error('live '+scene+' source mismatch: '+state.src);
              if(state.loop)throw new Error('live '+scene+' hero must not hard-loop');
              if(scene==='light'&&(state.w!==854||state.h!==480))throw new Error('live cleaned workday asset dimensions mismatch: '+state.w+'x'+state.h);
              await page.close();
            }
            console.log('LIVE PROFESSIONAL HERO QA PASS — BOTH WORKDAY SCENES');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
