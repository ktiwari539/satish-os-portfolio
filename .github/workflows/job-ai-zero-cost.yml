name: Job AI Agent Zero-Cost CI

on:
  push:
    branches:
      - test/job-ai-agent-zero-cost
  pull_request:
    paths:
      - "job-ai-agent/**"
      - ".github/workflows/job-ai-zero-cost.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify zero-cost and secret-safe source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE "OPENAI_API_KEY|ANTHROPIC_API_KEY|GOOGLE_API_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}" job-ai-agent --exclude="README.md"; then
            echo "Paid API or secret reference detected."
            exit 1
          fi

      - name: Compile
        run: python -m compileall -q job-ai-agent/src

      - name: Unit tests
        run: python -m unittest discover -s job-ai-agent/tests -v

      - name: Offline dry-run smoke test
        run: |
          python job-ai-agent/src/cli.py --demo \
            --db /tmp/job-agent-ci.db \
            --audit /tmp/job-agent-ci.csv
          test -s /tmp/job-agent-ci.csv
