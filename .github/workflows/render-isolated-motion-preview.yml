name: Render isolated Satish OS review video
on:
  push:
    branches: [main]
    paths: [.github/workflows/render-isolated-motion-preview.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/animated-opening-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline renderer
        run: |
          python -m pip install numpy opencv-python-headless
          ffmpeg -version | head -1
      - name: Create the preview MP4 from generated art
        run: python scripts/build_motion_preview.py
      - name: Commit video only to review branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/intro-motion-preview.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add review-only six-second character motion test"
            git push origin HEAD:preview/animated-opening-v1
          fi
