name: Publish interactive 3D Satish lab
# Pages enabled in repository settings
on:
  push:
    branches: [feature/interactive-3d-satish]
    paths:
      - interactive-3d-preview.html
      - .github/workflows/interactive-3d-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: interactive-3d-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interactive-3d-satish
      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp interactive-3d-preview.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
