name: Optimize Satish OS videos for web playback
on:
  push:
    branches: [review/final-cinematic-20260928]
    paths:
      - .github/workflows/optimize-pages-video.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faststart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/final-cinematic-20260928
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Move MP4 metadata to the front without re-encoding
        run: |
          set -euo pipefail
          for f in             assets/video/satish-welcome.mp4             assets/video/satish-refresh-entry.mp4             assets/video/satish-explore.mp4             assets/video/satish-idle.mp4
          do
            tmp="${f%.mp4}.faststart.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "$f" -map 0 -c copy -movflags +faststart "$tmp"
            mv "$tmp" "$f"
            ffprobe -v error -show_entries format=format_name,duration -show_entries stream=codec_name -of default=nw=1 "$f"
          done
      - name: Commit optimized video containers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/*.mp4
          if git diff --cached --quiet; then
            echo "Videos already optimized."
            exit 0
          fi
          git commit -m "Optimize cinematic videos for browser streaming"
          git push origin HEAD:review/final-cinematic-20260928
