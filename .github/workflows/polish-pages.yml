name: Publish Satish OS polish review
on:
  push:
    branches: [feature/portfolio-polish-20260928]
    paths:
      - index.html
      - styles.css
      - app.js
      - resume/**
      - .github/workflows/polish-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: satish-os-polish-review
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout polished feature
        uses: actions/checkout@v4
        with:
          ref: feature/portfolio-polish-20260928
          path: feature

      - name: Checkout stable review
        uses: actions/checkout@v4
        with:
          ref: review/final-cinematic-20260928
          path: stable

      - name: Build improved resume
        run: |
          python3 -m pip install --quiet reportlab
          python3 feature/resume/build_resume.py feature/assets/resume/Satish_Kumar_Tiwari_Resume.pdf
          test "$(stat -c%s feature/assets/resume/Satish_Kumar_Tiwari_Resume.pdf)" -gt 1000
          head -c 5 feature/assets/resume/Satish_Kumar_Tiwari_Resume.pdf | grep -q '%PDF-'

      - name: Assemble stable root plus isolated polish preview
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/polish

          cp stable/index.html stable/styles.css stable/app.js _site/
          cp stable/index.html _site/review-current.html
          cp -R stable/assets _site/

          cp feature/index.html feature/styles.css feature/app.js _site/polish/
          cp -R feature/assets _site/polish/
          touch _site/.nojekyll _site/polish/.nojekyll

      - name: Install Google Chrome QA runtime
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chrome >/dev/null

      - name: Desktop and mobile polish QA
        run: |
          set -euo pipefail
          node --check feature/app.js
          python3 -m http.server 4178 --directory _site >/tmp/satish-polish-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            const failures=[];
            for(const v of [{name:'desktop',width:1440,height:900},{name:'mobile',width:390,height:844}]){
              const page=await browser.newPage({viewport:{width:v.width,height:v.height},reducedMotion:'no-preference'});
              page.on('pageerror',e=>failures.push(v.name+': '+e.message));
              await page.goto('http://127.0.0.1:4178/polish/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#intro').waitFor({state:'visible',timeout:8000});
              const welcome=page.locator('#introVideo');
              const t0=await welcome.evaluate(x=>x.currentTime);
              await page.waitForTimeout(1100);
              const t1=await welcome.evaluate(x=>x.currentTime);
              if(t1<=t0+.1) failures.push(v.name+': welcome video did not advance');

              await page.locator('#skipIntro').click();
              await page.locator('#intro').waitFor({state:'hidden',timeout:3000});

              if(await page.locator('.impact-ribbon>div').count()!==4) failures.push(v.name+': impact ribbon count');
              await page.locator('[data-toolkit="visibility"]').click();
              if(!(await page.locator('#toolkitTitle').innerText()).includes('decision')) failures.push(v.name+': toolkit interaction');

              await page.locator('.project-card [data-open="automation"]').click();
              await page.locator('#projectModal').waitFor({state:'visible',timeout:3000});
              if(await page.locator('.project-impact-panel div').count()!==3) failures.push(v.name+': project metrics missing');
              await page.locator('#closeModal').click();

              const resumeRes=await page.request.get('http://127.0.0.1:4178/polish/assets/resume/Satish_Kumar_Tiwari_Resume.pdf');
              if(!resumeRes.ok() || (await resumeRes.body()).length<1000) failures.push(v.name+': improved resume unavailable');

              await page.locator('#satishLogo').click();
              await page.locator('#intro').waitFor({state:'visible',timeout:3000});
              await page.waitForFunction(()=>document.querySelector('#introVideo')?.currentSrc.includes('satish-refresh-entry.mp4'),null,{timeout:5000});
              const w0=await page.locator('#introVideo').evaluate(x=>x.currentTime);
              await page.waitForTimeout(1100);
              const w1=await page.locator('#introVideo').evaluate(x=>x.currentTime);
              if(w1<=w0+.1) failures.push(v.name+': walk-in did not advance');

              await page.locator('#skipIntro').click();
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+4);
              if(overflow) failures.push(v.name+': horizontal overflow');
              await page.close();
            }
            await browser.close();
            if(failures.length)throw new Error(failures.join('\n'));
            console.log('POLISH QA PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy stable root + polish review
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live polish review
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'no-preference'});
            const url='https://ktiwari539.github.io/satish-os-portfolio/polish/?qa='+Date.now();
            let last;
            for(let i=0;i<8;i++){
              try{
                const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:20000});
                if(r?.ok()){last=r;break}
              }catch(e){}
              await page.waitForTimeout(2500);
            }
            if(!last?.ok())throw new Error('live polish page unavailable');
            await page.locator('#intro').waitFor({state:'visible',timeout:8000});
            const t0=await page.locator('#introVideo').evaluate(x=>x.currentTime);
            await page.waitForTimeout(1200);
            const t1=await page.locator('#introVideo').evaluate(x=>x.currentTime);
            if(t1<=t0+.1)throw new Error('live welcome video not advancing');
            await page.locator('#skipIntro').click();
            await page.locator('#satishLogo').click();
            await page.locator('#intro').waitFor({state:'visible',timeout:3000});
            await page.waitForFunction(()=>document.querySelector('#introVideo')?.currentSrc.includes('satish-refresh-entry.mp4'),null,{timeout:5000});
            const w0=await page.locator('#introVideo').evaluate(x=>x.currentTime);
            await page.waitForTimeout(1200);
            const w1=await page.locator('#introVideo').evaluate(x=>x.currentTime);
            if(w1<=w0+.1)throw new Error('live walk-in video not advancing');
            console.log('LIVE POLISH QA PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
